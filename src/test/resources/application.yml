spring:
  application:
    name: evops-base-test
  datasource:
    url: jdbc:h2:mem:evops_test;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    com.evops: INFO
